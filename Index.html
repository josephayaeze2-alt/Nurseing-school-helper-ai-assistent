<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURSE · 3D AI Companion</title>
  <style>
    /* ---------- global reset & base ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- FADED 3D BLURRED CIRCLES (blue/pink/purple) ---------- */
    .circle-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .circle-bg span {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px) brightness(1.2);
      opacity: 0.22;
      mix-blend-mode: screen;
      animation: float 18s infinite alternate ease-in-out;
    }

    .circle-bg span:nth-child(1) {
      width: 420px;
      height: 420px;
      background: #4a6eff;        /* blue */
      top: -120px;
      left: -120px;
      animation-duration: 22s;
    }
    .circle-bg span:nth-child(2) {
      width: 550px;
      height: 550px;
      background: #ff77aa;        /* pink */
      bottom: -180px;
      right: -120px;
      opacity: 0.18;
      filter: blur(65px);
      animation-duration: 26s;
    }
    .circle-bg span:nth-child(3) {
      width: 380px;
      height: 380px;
      background: #b483ff;        /* purple */
      top: 35%;
      left: 75%;
      opacity: 0.2;
      filter: blur(50px);
      animation-duration: 20s;
      animation-delay: -5s;
    }
    .circle-bg span:nth-child(4) {
      width: 460px;
      height: 460px;
      background: #9f7aea;        /* violet */
      bottom: 5%;
      left: 0%;
      opacity: 0.16;
      filter: blur(70px);
      animation-duration: 28s;
      animation-delay: -8s;
    }
    .circle-bg span:nth-child(5) {
      width: 320px;
      height: 320px;
      background: #6b8cff;        /* blue */
      top: 5%;
      right: 15%;
      opacity: 0.18;
      filter: blur(45px);
      animation-duration: 18s;
      animation-delay: -2s;
    }
    .circle-bg span:nth-child(6) {
      width: 400px;
      height: 400px;
      background: #ff8bc2;        /* pink */
      bottom: 25%;
      left: 35%;
      opacity: 0.14;
      filter: blur(60px);
      animation-duration: 24s;
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -50px) scale(1.1); }
    }

    /* ---------- 3D PERSPECTIVE SCENE ---------- */
    .scene {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1000px;
      perspective: 1500px;
      perspective-origin: 50% 0%;
      margin: 0 auto;
    }

    /* main 3D card (the whole chat interface) */
    .card-3d {
      background: rgba(12, 12, 24, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 2.8rem;
      padding: 2rem 1.8rem;
      border: 1px solid rgba(180, 160, 255, 0.3);
      box-shadow: 
        0 30px 50px -20px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(140, 120, 255, 0.15) inset,
        0 0 40px rgba(110, 100, 255, 0.25);
      transform-style: preserve-3d;
      transform: rotateX(2deg) rotateY(-1deg) translateZ(10px);
      transition: transform 0.25s ease-out, box-shadow 0.3s;
      color: #fff;
    }

    .card-3d:hover {
      transform: rotateX(1deg) rotateY(-0.5deg) translateZ(18px);
      box-shadow: 
        0 40px 60px -20px #000,
        0 0 0 1px rgba(200, 170, 255, 0.35) inset,
        0 0 60px rgba(140, 100, 255, 0.35);
    }

    /* header area — AI personality */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      transform: translateZ(30px);
      flex-wrap: wrap;
    }

    .avatar-glow {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7a9eff, #c87aff, #ff88b0);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 30px #b483ff, 0 0 0 3px rgba(200, 170, 255, 0.4);
      transform: translateZ(25px);
      animation: pulse-glow 3s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 20px #7a9eff, 0 0 0 2px rgba(180, 140, 255, 0.3); }
      100% { box-shadow: 0 0 45px #d08aff, 0 0 0 5px rgba(200, 150, 255, 0.5); }
    }

    .header-text h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #d0d9ff, #f0c0e0, #d9b8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 8px 20px rgba(140, 100, 255, 0.5);
      transform: translateZ(20px);
      line-height: 1.2;
    }

    .header-text .status {
      font-size: 0.95rem;
      color: #b8b0e8;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateZ(10px);
      font-weight: 300;
      letter-spacing: 0.3px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #6affb0;
      border-radius: 50%;
      box-shadow: 0 0 15px #6affb0;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ---------- CHAT MESSAGES AREA ---------- */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 460px;
      max-height: 55vh;
      background: rgba(8, 8, 18, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 2rem;
      padding: 1.5rem 1.2rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(140, 140, 255, 0.15);
      box-shadow: 
        0 15px 25px -10px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(160, 140, 255, 0.1) inset;
      overflow-y: auto;
      transform-style: preserve-3d;
      transform: translateZ(15px);
      scroll-behavior: smooth;
    }

    /* custom scrollbar */
    .chat-container::-webkit-scrollbar {
      width: 6px;
    }
    .chat-container::-webkit-scrollbar-track {
      background: rgba(50, 40, 80, 0.3);
      border-radius: 20px;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: #7f6ac0;
      border-radius: 20px;
      box-shadow: 0 0 10px #b483ff;
    }

    /* message bubbles */
    .message {
      display: flex;
      margin-bottom: 1.2rem;
      transform-style: preserve-3d;
      animation: fadeInUp 0.35s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px) translateZ(-10px); }
      to { opacity: 1; transform: translateY(0) translateZ(5px); }
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 0.9rem 1.3rem;
      border-radius: 1.6rem;
      font-size: 1rem;
      line-height: 1.5;
      box-shadow: 0 8px 18px -8px #000;
      backdrop-filter: blur(4px);
      transform: translateZ(10px);
      word-break: break-word;
    }

    .message.bot .bubble {
      background: rgba(40, 35, 70, 0.85);
      border: 1px solid rgba(180, 150, 255, 0.4);
      color: #e8e2ff;
      border-bottom-left-radius: 0.4rem;
      box-shadow: 0 0 20px rgba(140, 100, 255, 0.25);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, rgba(80, 100, 240, 0.75), rgba(180, 100, 220, 0.7));
      border: 1px solid rgba(220, 180, 255, 0.6);
      color: #ffffff;
      border-bottom-right-radius: 0.4rem;
      box-shadow: 0 0 25px rgba(160, 100, 255, 0.5);
    }

    /* typing indicator */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 0.6rem 1.2rem;
      background: rgba(40, 35, 70, 0.8);
      border-radius: 1.6rem;
      width: fit-content;
      border: 1px solid rgba(180, 150, 255, 0.35);
      margin-bottom: 0.8rem;
      animation: fadeInUp 0.3s ease-out;
    }

    .typing-indicator span {
      width: 10px;
      height: 10px;
      background: #b7a9ff;
      border-radius: 50%;
      animation: wave 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* ---------- INPUT AREA ---------- */
    .input-area {
      display: flex;
      gap: 0.8rem;
      transform-style: preserve-3d;
      transform: translateZ(25px);
    }

    .input-area input {
      flex: 1;
      background: rgba(20, 18, 35, 0.9);
      border: 1px solid rgba(150, 130, 255, 0.4);
      border-radius: 3rem;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      color: #ffffff;
      font-family: inherit;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s, transform 0.15s;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(100, 80, 200, 0.2) inset;
    }

    .input-area input::placeholder {
      color: #9a94c0;
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    .input-area input:focus {
      border-color: #b483ff;
      box-shadow: 0 0 25px #b483ff, 0 0 0 2px rgba(180, 140, 255, 0.3) inset;
      transform: scale(1.01) translateZ(5px);
    }

    .input-area button {
      background: linear-gradient(135deg, #6a7eff, #b37aff);
      border: none;
      border-radius: 3rem;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 25px #9f7aff, 0 0 0 1px rgba(200, 180, 255, 0.6);
      transition: transform 0.15s, box-shadow 0.2s;
      transform: translateZ(20px);
      font-weight: 300;
      line-height: 1;
    }

    .input-area button:hover {
      transform: translateZ(30px) scale(1.05);
      box-shadow: 0 0 45px #c08aff, 0 0 0 2px rgba(220, 190, 255, 0.8);
    }

    .input-area button:active {
      transform: translateZ(15px) scale(0.96);
    }

    /* small footer hints */
    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: #a0a0c0;
      text-align: center;
      border-top: 1px dashed rgba(130, 130, 200, 0.3);
      padding-top: 1.2rem;
      transform: translateZ(5px);
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      letter-spacing: 0.3px;
      font-weight: 300;
    }

    .footer-note span {
      background: rgba(80, 70, 120, 0.2);
      padding: 0.25rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(150, 130, 220, 0.2);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 700px) {
      body { padding: 0.8rem; }
      .card-3d { padding: 1.5rem 1rem; border-radius: 2rem; }
      .header-text h1 { font-size: 1.8rem; }
      .avatar-glow { width: 50px; height: 50px; font-size: 1.6rem; }
      .chat-container { height: 380px; padding: 1rem; }
      .bubble { max-width: 90%; font-size: 0.95rem; }
      .input-area button { width: 52px; height: 52px; font-size: 1.5rem; }
      .input-area input { padding: 0.9rem 1.2rem; }
    }

    @media (max-width: 480px) {
      .header-text h1 { font-size: 1.5rem; }
      .bubble { max-width: 95%; }
    }
  </style>
</head>
<body>
  <!-- faded blurred circles background -->
  <div class="circle-bg">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- 3D scene wrapper -->
  <div class="scene">
    <div class="card-3d">

      <!-- AI personality header -->
      <div class="header">
        <div class="avatar-glow">🤖</div>
        <div class="header-text">
          <h1>NURSE<span style="font-size: 1.2rem;">✨</span></h1>
          <div class="status">
            <span class="status-dot"></span> AI companion · 3D med guide
          </div>
        </div>
      </div>

      <!-- chat messages container -->
      <div class="chat-container" id="chatContainer">
        <!-- welcome messages generated by JS -->
      </div>

      <!-- input & send -->
      <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about meds, procedures, or just say hi…" autocomplete="off" />
        <button id="sendBtn" aria-label="Send">➤</button>
      </div>

      <!-- tiny footer with friendly reminders -->
      <div class="footer-note">
        <span>💊 medication help</span>
        <span>🩺 clinical tips</span>
        <span>😊 friendly &amp; 3D</span>
      </div>

    </div>
  </div>

  <script>
    (function() {
      // ----- DOM refs -----
      const chatContainer = document.getElementById('chatContainer');
      const userInput = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');

      // ----- state -----
      let isTyping = false;
      let messageHistory = []; // optional

      // ----- helper: scroll to bottom -----
      function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // ----- add message bubble -----
      function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = text; // allow simple formatting (e.g., <br>)
        msgDiv.appendChild(bubble);
        chatContainer.appendChild(msgDiv);
        scrollToBottom();
        return msgDiv;
      }

      // ----- typing indicator (add & remove) -----
      function showTypingIndicator() {
        const existing = document.querySelector('.typing-indicator');
        if (existing) existing.remove();

        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        indicator.innerHTML = '<span></span><span></span><span></span>';
        chatContainer.appendChild(indicator);
        scrollToBottom();
        return indicator;
      }

      function removeTypingIndicator(indicator) {
        if (indicator && indicator.parentNode) {
          indicator.remove();
        }
      }

      // ----- AI response generator (friendly, helpful, occasional jokes) -----
      function generateResponse(query) {
        const q = query.toLowerCase().trim();

        // --- friendly jokes / fun ---
        if (q.includes('joke') || q.includes('funny') || q.includes('laugh')) {
          const jokes = [
            "Why did the nurse go to art school? Because she wanted to learn how to draw blood! 🩸😄",
            "What's a nurse's favorite song? 'I Will Always Love You' — especially the part 'and I will always love you...r blood pressure'. 💉🎶",
            "Why did the nurse always carry a red marker? In case she needed to draw some blood! 😂 (okay, that was bad)",
            "What do you call a nurse with a broken leg? A crutch nurse! (I'll see myself out) 🚪😅",
            "Never trust a nurse who says 'this won't hurt a bit'... they're usually lying. But we still love them! 💕"
          ];
          return jokes[Math.floor(Math.random() * jokes.length)];
        }

        // --- medication specific ---
        if (q.includes('medication') || q.includes('medicine') || q.includes('drug') || q.includes('dose') || q.includes('pill') || q.includes('med')) {
          return `💊 <strong>Medication quick guide:</strong><br><br>
          • <strong>Always verify</strong> the 5 rights: patient, drug, dose, route, time.<br>
          • <strong>Common meds:</strong> Metformin (with meals), Lisinopril (watch BP), Atorvastatin (evening).<br>
          • <strong>Tip:</strong> Use two identifiers and document immediately.<br><br>
          <em>Need a specific drug? Ask me — I'll give you a friendly rundown! 😊</em>`;
        }

        if (q.includes('insulin') || q.includes('blood sugar') || q.includes('diabetes')) {
          return `🩸 <strong>Insulin / diabetes pearls:</strong><br>
          • Rapid-acting insulin: give 5–15 min before meals.<br>
          • Check blood glucose before and after.<br>
          • Watch for hypoglycemia: shaky, sweaty, confused → give 15g fast carbs.<br><br>
          You've got this! 💪 (And if you need a smile: why did the insulin cross the road? To get to the other side of the cell! 😄)`;
        }

        if (q.includes('pain') || q.includes('analgesic') || q.includes('morphine') || q.includes('painkiller')) {
          return `💉 <strong>Pain management essentials:</strong><br>
          • Assess pain using a 0–10 scale (or appropriate tool).<br>
          • Morphine: watch for respiratory depression.<br>
          • Multimodal approach: ice, elevation, distraction, and scheduled meds.<br><br>
          <em>Remember: pain is what the patient says it is.</em> 🩺`;
        }

        // --- clinical procedures ---
        if (q.includes('iv') || q.includes('intravenous') || q.includes('cannula') || q.includes('line')) {
          return `🩺 <strong>IV therapy tips:</strong><br>
          • Choose the largest appropriate vein; start distal.<br>
          • Clean with chlorhexidine and let it dry.<br>
          • Check patency with a flush.<br>
          • Monitor for phlebitis (redness, swelling).<br><br>
          <em>Pro tip: a warm compress helps plump up veins! 💙</em>`;
        }

        if (q.includes('wound') || q.includes('dressing') || q.includes('bandage') || q.includes('suture')) {
          return `🩹 <strong>Wound care basics:</strong><br>
          • Clean from clean to dirty (or use sterile technique).<br>
          • Moist wound healing is usually best.<br>
          • Document size, drainage, and surrounding skin.<br><br>
          <em>And remember — not every wound needs a hero, but every nurse is one! 🦸‍♀️</em>`;
        }

        if (q.includes('vital') || q.includes('bp') || q.includes('blood pressure') || q.includes('pulse') || q.includes('temperature')) {
          return `📊 <strong>Vital signs quick reference:</strong><br>
          • Normal adult BP: &lt;120/80 mmHg<br>
          • HR: 60–100 bpm<br>
          • RR: 12–20/min<br>
          • Temp: 36.5–37.5°C (97.7–99.5°F)<br>
          • SpO₂: ≥95%<br><br>
          <em>Always compare to the patient's baseline!</em> 🩺`;
        }

        if (q.includes('handoff') || q.includes('report') || q.includes('sbar')) {
          return `📋 <strong>SBAR handoff:</strong><br>
          • <strong>S</strong>ituation — what's going on now?<br>
          • <strong>B</strong>ackground — relevant history.<br>
          • <strong>A</strong>ssessment — your clinical impression.<br>
          • <strong>R</strong>ecommendation — what you need.<br><br>
          <em>Clear handoff = safer patient. You rock! 🤘</em>`;
        }

        // --- general support / greetings ---
        if (q.includes('hi') || q.includes('hello') || q.includes('hey') || q.includes('good morning') || q.includes('good evening')) {
          const greetings = [
            "Hey there, superstar nurse! 👋 What can I help you with today?",
            "Hello! Ready to tackle the day? I'm here for meds, procedures, or just a friendly chat. 😊",
            "Hi! You're doing amazing work. Need a quick reference or a joke? Just ask! 💙"
          ];
          return greetings[Math.floor(Math.random() * greetings.length)];
        }

        if (q.includes('thank') || q.includes('thanks')) {
          return "You're so welcome! 💖 Keep being awesome — and remember, you make a real difference. 🩺✨";
        }

        if (q.includes('help') || q.includes('what can you do')) {
          return `I'm your 3D nurse companion! I can help with:<br>
          • 💊 Medication info & safety<br>
          • 🩺 Clinical procedures (IV, wounds, vitals)<br>
          • 📋 SBAR handoffs<br>
          • 😄 Friendly jokes & encouragement<br><br>
          Just type a question — I'll give you a friendly, accurate answer!`;
        }

        // --- fallback: friendly, helpful and slightly humorous ---
        const fallbacks = [
          `That's a great question! I'm still learning, but here's a general thought: always check your facility's protocol and use your clinical judgment. And remember — you're smarter than you think! 💪<br><br><em>(If you need something specific, try asking about "meds", "IV", "wound care", or "vitals".)</em>`,
          `Hmm, I don't have the exact answer on that one, but I trust your nursing skills! 🩺 Double-check with a colleague or policy. Also — why did the nurse bring a ladder to work? Because she wanted to reach the *high* standards of care! 😄`,
          `I'm not 100% sure on that, but I can point you in the right direction: check the policy manual or ask a senior nurse. Meanwhile, here's a joke: What do you call a nurse who's always calm? A *patient* nurse! 😂<br><br>Try rephrasing or ask about medications, procedures, or vitals.`
        ];
        return fallbacks[Math.floor(Math.random() * fallbacks.length)];
      }

      // ----- main send handler -----
      function handleSend() {
        const rawText = userInput.value.trim();
        if (rawText === '' || isTyping) return;

        // add user message
        addMessage(rawText, 'user');
        userInput.value = '';
        userInput.focus();

        // set typing lock
        isTyping = true;
        const typingIndicator = showTypingIndicator();

        // simulate AI thinking and responding
        setTimeout(() => {
          removeTypingIndicator(typingIndicator);

          // generate response
          const responseText = generateResponse(rawText);
          addMessage(responseText, 'bot');

          // unlock
          isTyping = false;
        }, 700 + Math.random() * 500); // random delay 700–1200ms
      }

      // ----- initial welcome messages -----
      function initChat() {
        // clear any placeholder
        chatContainer.innerHTML = '';

        // AI welcomes
        addMessage("👋 Hey there, nurse! I'm your 3D AI companion. Ask me about medications, procedures, vitals, or just say hi!", 'bot');

        // a second friendly message with a tiny joke
        setTimeout(() => {
          addMessage("💡 <em>Fun fact: I never get tired of answering questions — unlike my human colleagues after a 12-hour shift! (Respect to you all.)</em>", 'bot');
        }, 500);

        setTimeout(() => {
          addMessage("What's on your mind today? 💊🩺", 'bot');
        }, 1000);
      }

      // ----- event listeners -----
      sendBtn.addEventListener('click', handleSend);

      userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSend();
        }
      });

      // auto-focus input on load
      window.addEventListener('load', () => {
        userInput.focus();
      });

      // start chat
      initChat();

    })();
  </script>
</body>
</html>
